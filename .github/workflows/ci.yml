name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # S345 — SCOPE WIDENED TO app/ AND shared/. S344 mutation-tested this guard:
      # violations in src/ and supabase/functions/ were caught, but the SAME
      # violation in shared/lib/ was NOT — and shared code reaches the shipped
      # client bundle (PLATFORM_NAME's value appears in the built admin JS).
      # That bundle is served UNAUTHENTICATED at /_admin/assets/*, which is why
      # the original leak was a P0 rather than a tidy-up. This session's own arc
      # has been moving code INTO shared/lib (serviceCatalog, settingsMerge,
      # businessInfoMerge), so the blind spot sat exactly where new shared
      # helpers now land. app/ is the Next.js tree: import.meta.env is a Vite
      # substitution and would not inline there, but a direct api.anthropic.com
      # call from a client component would ship just the same.
      #
      # S243 W1 (widened) — fail the build if any direct Anthropic reference
      # reappears in frontend OR edge functions. All AI calls must route through
      # ai-proxy (frontend via callAi(); server via ai-proxy public/internal).
      # ai-proxy itself is the one authorized direct caller, so it is excluded.
      # The domain pattern requires the https:// scheme so it matches real API
      # calls (always https://api.anthropic.com/v1/messages) without false-
      # positiving on doc comments like "never calls api.anthropic.com" that
      # live in functions outside the authorized edit set.
      - name: Guard — no direct Anthropic calls
        run: |
          if grep -rEn "https://api\.anthropic\.com|VITE_ANTHROPIC" src/ app/ shared/ supabase/functions/ --exclude-dir=ai-proxy; then
            echo "::error::Forbidden Anthropic-direct reference. Route AI calls through ai-proxy (frontend: src/lib/ai/callAi.ts; server: ai-proxy public/internal route)."
            exit 1
          fi
          echo "ai-proxy guard passed: no direct api.anthropic.com / VITE_ANTHROPIC in src/, app/, shared/ or supabase/functions/ (excluding ai-proxy)"

      # S284 — the vitest suite, which until now had never gated a single PR.
      # 535 tests ran exactly once, locally, on the machine that wrote them.
      # Among them is the assertion that generate-monthly-report's PLATFORM_RULES
      # block is byte-identical to the S261 anti-hallucination hardening that
      # stops the report narrator inventing WordPress, Yoast and Rank Math — one
      # reflow of that string used to break it with CI still reporting green.
      #
      # `vitest run` is the non-watch form; no --passWithNoTests or any other
      # flag that could turn a real failure into a pass. The eight Deno tests
      # that made a bare `npx vitest run` exit 1 are excluded in vitest.config.ts
      # (they call Deno.test and import https:// URLs, so vitest could never load
      # them); supabase/functions/_shared/auth/ is covered for real by the
      # auth-isolation-test job below.
      - name: Unit tests (vitest)
        run: npx vitest run

      # S327 — the SHELL guards, which until now nothing ran.
      #
      # .claude/hooks/manifest-entry.test.sh has existed since the manifest-hook fix and
      # was executed by no workflow, no npm script and no pre-commit step: a guard that
      # cannot fail, which is the exact failure mode this repo has now been bitten by five
      # times. Adding scripts/deploy-function.test.sh without wiring it would have made it
      # the sixth on the day it was written.
      #
      # These are plain bash with no Node dependency, so they cost ~2s and cannot flake on
      # a registry. `bash -n` first: a syntax error in the deploy wrapper would otherwise
      # surface as a refusal-to-deploy during an incident, which is the worst possible
      # moment to discover it.
      # S337 — the redeploy workflow's verifier only ever ran on push-to-main, so
      # its logic was never exercised where a contributor could see it: it failed
      # ten consecutive runs over ten weeks unnoticed. These tests run its PURE
      # parts (the comparison, the config.toml pin rule, the error diagnosis)
      # against fixture data on every PR. The live Management API call is NOT
      # faked — a fixture asserting the platform agrees with config.toml would
      # make the guard vacuous, which is the exact S319 defect class.
      - name: Verifier unit tests (verify_verify_jwt)
        run: python3 .github/scripts/verify_verify_jwt_test.py

      - name: Shell guards (deploy freshness, manifest hooks)
        run: |
          set -euo pipefail
          for f in scripts/deploy-function.sh .claude/hooks/*.sh; do
            bash -n "$f" || { echo "::error::$f has a syntax error"; exit 1; }
          done
          bash scripts/deploy-function.test.sh
          bash .claude/hooks/session-end.test.sh
          bash .claude/hooks/manifest-entry.test.sh

  # S273 — TENANT-ISOLATION GATE (Principle 7). Spins up a real local Supabase stack
  # and runs the Deno cross-tenant isolation test against requireTenantUser — the SSOT
  # auth boundary all 18 tenant-context edge functions funnel through. This is the first
  # test-runner step in CI (previously only tsc/lint/grep ran). The test mints a REAL
  # member-of-A JWT and asserts a request for tenant B returns 403 — authenticated
  # context, not service-role bypass.
  auth-isolation-test:
    name: Auth isolation (Deno + local Supabase)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned (S273) — keep in lockstep with redeploy-edge-on-shared-change.yml
          # so local stack / migration behaviour is reproducible across CI jobs.
          version: 2.84.2

      # The repo's full migration history is NOT replayable from zero (e.g.
      # 20260405_fix_rls_policies.sql references stripe_payments, never created by an
      # earlier migration — it exists only on the live remote). requireTenantUser
      # reads ONLY tenant_users, so we replace the migration set with a focused
      # fixture and run against real Postgres + GoTrue. Replayable full-history
      # migrations are a separate pre-existing cleanup, out of scope for this PR.
      # The repo's full migration history is NOT replayable from zero (e.g.
      # 20260405_fix_rls_policies.sql references stripe_payments, never created by an
      # earlier migration — it exists only on the live remote). So we stage a focused
      # fixture, then apply the REAL PR #2a migration on top (so pgTAP exercises the
      # actual role-gated RLS, helper, hardening + drift view — not a copy).
      - name: Stage focused test schema + real PR #2a migration
        run: |
          mkdir -p /tmp/stage
          cp supabase/tests/fixtures/00000000000001_iso_min_schema.sql /tmp/stage/
          cp supabase/migrations/20260618000000_s273_pr2a_permission_foundation.sql /tmp/stage/
          # S336 — rescue the merge-function migration BEFORE this step deletes
          # supabase/migrations. It is applied later with psql, deliberately NOT
          # staged into supabase/migrations: the CLI expects a
          # <timestamp>_name.sql filename and this file is untimestamped on
          # purpose (it records DDL already applied to production).
          cp supabase/migrations/s336_merge_setting_value.sql /tmp/s336_merge_setting_value.sql
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          cp /tmp/stage/* supabase/migrations/

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase env
        run: |
          supabase status -o env > .supabase-status.env
          echo "SUPABASE_URL=$(grep -E '^API_URL=' .supabase-status.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep -E '^SERVICE_ROLE_KEY=' .supabase-status.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep -E '^ANON_KEY=' .supabase-status.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$(grep -E '^DB_URL=' .supabase-status.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          rm -f .supabase-status.env

      # --no-check: this job verifies RUNTIME behaviour, not types. Deno's type-checker
      # follows the esm.sh supabase-js types into a @types/node reference it can't
      # resolve without node_modules; src/ type safety is covered by the Validate tsc.
      - name: Run cross-tenant isolation test (Deno)
        run: deno test --no-check --allow-net --allow-env supabase/functions/_shared/auth/

      # S273 PR #2a — pgTAP: role-gated content-table RLS. Asserts a 'user' member
      # cannot INSERT/UPDATE/DELETE content surfaces, 'manager'/'admin' can, and the
      # binding-drift view excludes the operator seed. Runs in authenticated context
      # (SET ROLE authenticated + jwt claims), not as the RLS-bypassing superuser.
      - name: Run role-RLS test (pgTAP)
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pr2a_permissions.pgtap.sql > pgtap.out 2>&1 || { echo '--- pgTAP output ---'; cat pgtap.out; exit 1; }
          echo '--- pgTAP output ---'; cat pgtap.out
          if grep -qE '^not ok' pgtap.out; then echo '::error::pgTAP role-RLS assertions failed'; exit 1; fi

      # S336 — the settings-merge corpus. Applies the UNTIMESTAMPED s336 migration
      # with psql rather than staging it into supabase/migrations: the CLI expects
      # a <timestamp>_name.sql filename, and the file is deliberately not
      # timestamped (it records DDL already applied to production). Running the
      # migration FILE here also proves the file itself works — not merely that
      # the functions exist somewhere.
      - name: Install S336 merge functions (from the migration file)
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f /tmp/s336_merge_setting_value.sql

      # Reads shared/fixtures/settingsMergeCorpus.json — the SAME file
      # shared/lib/settingsMerge.corpus.test.ts asserts against in vitest. One
      # corpus, two implementations; a case that passes one and fails the other
      # is the finding the S334 gate asked for.
      - name: Run settings-merge corpus (pgTAP)
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/s336_merge_setting_value.pgtap.sql > s336.out 2>&1 || { echo '--- pgTAP output ---'; cat s336.out; exit 1; }
          echo '--- pgTAP output ---'; cat s336.out
          if grep -qE '^not ok' s336.out; then echo '::error::S336 settings-merge corpus assertions failed'; exit 1; fi

      # A guard that cannot fail is worthless. Each mutant removes exactly ONE
      # rule from the merge and must fail at least one corpus case; the real
      # function is re-asserted clean in the same run, which is what makes
      # "the mutant fails" mean anything. Mutants live in pg_temp inside a
      # rolled-back transaction, so nothing persists even if the run aborts.
      - name: Run settings-merge MUTATION test (pgTAP)
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/s336_merge_mutations.pgtap.sql > s336mut.out 2>&1 || { echo '--- pgTAP output ---'; cat s336mut.out; exit 1; }
          echo '--- pgTAP output ---'; cat s336mut.out
          if grep -qE '^not ok' s336mut.out; then echo '::error::S336 mutation assertions failed — a merge rule can be deleted without the corpus noticing'; exit 1; fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
